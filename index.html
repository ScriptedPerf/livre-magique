<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livre Magique</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'float': 'float 20s infinite alternate',
          },
          keyframes: {
            float: {
              '0%': { transform: 'translate(0, 0) scale(1)' },
              '100%': { transform: 'translate(50px, 50px) scale(1.1)' },
            }
          }
        }
      }
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
    rel="stylesheet">
  <style type="text/tailwindcss">
    @layer utilities {
      .glass {
        @apply bg-white/70 backdrop-blur-xl border border-white/40 shadow-xl;
      }
      .glass-card {
        @apply bg-white/80 backdrop-blur-md border border-white/50 shadow-lg hover:shadow-2xl transition-all duration-300;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    }
  </style>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }

    .font-serif {
      font-family: 'Lora', serif;
    }

    /* Custom scrollbar for a cleaner look */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #cbd5e1;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <script>window.env = {};</script>
  <script src="/config.js?v=__APP_VERSION__" onerror="console.log('Using baked-in environment variables')"></script>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
